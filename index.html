<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Radar - Don't Miss Your Next Opportunity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">🎯 Opportunity Radar</div>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#opportunities">Opportunities</a>
                <a href="#about">About</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="container">
            <h1 class="hero-title">DON'T MISS YOUR NEXT OPPORTUNITY 🚀</h1>
            <p class="hero-subtitle">Find internships, jobs, hackathons, scholarships and contests in one place.</p>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-bar" 
                    placeholder="Search opportunities, companies...">
                <button class="search-btn">Search</button>
            </div>
        </div>
    </section>

    <!-- Category Buttons -->
    <section class="categories">
        <div class="container">
            <div class="category-buttons">
                <button class="category-btn active" data-filter="all">All</button>
                <button class="category-btn" data-filter="internship">💼 Internships</button>
                <button class="category-btn" data-filter="job">🏢 Jobs</button>
                <button class="category-btn" data-filter="hackathon">🛠️ Hackathons</button>
                <button class="category-btn" data-filter="scholarship">🎓 Scholarships</button>
                <button class="category-btn" data-filter="contest">🏆 Contests</button>
            </div>
        </div>
    </section>

    <!-- Closing Soon Section -->
    <section class="closing-soon-section">
        <div class="container">
            <h2 class="section-title">🔥 Closing Soon</h2>
            <div class="opportunities-grid" id="closingSoon">
                <!-- Will be filled by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Latest Opportunities Section -->
    <section class="opportunities-section" id="opportunities">
        <div class="container">
            <h2 class="section-title">📌 Latest Opportunities</h2>
            <div class="opportunities-grid" id="opportunitiesGrid">
                <!-- Will be filled by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Opportunity Radar. Don't miss any opportunity!</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
